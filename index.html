.mb{background:#061535;border:1px solid rgba(200,168,75,.4);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:360px;width:100%}
.mt{font:600 16px Oswald;color:#f5d073;letter-spacing:2px;text-transform:uppercase}
.cv{width:100%;max-width:300px;touch-action:none;cursor:grab;border:2px solid #c8a84b;border-radius:8px;background:#000}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,deleteDoc,collection,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== 1. PASTE YOUR FIREBASE CONFIG HERE =====
const firebaseConfig = {
  apiKey: "AIzaSyDkGhScAIq0tkzEosWkScD0doTq9VyLaq4",
  authDomain: "cricketscoreapp-fa258.firebaseapp.com",
  projectId: "cricketscoreapp-fa258",
  storageBucket: "cricketscoreapp-fa258.firebasestorage.app",
  messagingSenderId: "833946397398",
  appId: "1:833946397398:web:a14bba67a7e3cbab9d7777"
};
// SHA-256 hashes of the team / admin passwords (not plaintext)
const TEAM_HASH  = "0086b0a2fd7337577f13ee53f8ea532160e1a682d2a874c3bb03ab568b3d4385";
const ADMIN_HASH = "b480e8847b73883823645bae4a47fc58796b34a3276a7c2e369c8805b79536b6";
const DEFAULT_TEAMS = ["Gladiators YB","KHAN JEE","KAPTAN 11","Pak EAGLES","RCC","SWAT XI","Riyadh Stallions","Riyadh Strikers","Saudi German","Punjab XI","Riyadh Kings","Team Avengers"];
const COL = "squads";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2,"0")).join("");

const S = {page:"home", team:null, viewOnly:false, edit:false, d:null, msg:"",teams:[],tours:[{id:"default",name:"Challenger's Cup"}],tname:"",tour:"",adminHash:null,seeded:false,err:""};

// ===== PHOTO CROPPER (drag + zoom) =====
function crop(file, ratio, circle){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.onload = () => {
      const W = 300, H = Math.round(W / ratio);
      const ov = document.createElement("div"); ov.className = "modal";
      ov.innerHTML = `<div class="mb"><div class="mt">Frame face + shoulders</div>
        <canvas width="${W}" height="${H}" class="cv ${circle ? "rc" : ""}"></canvas>
        <input type="range" id="z" min="1" max="6" step="0.01" value="1">
        <div class="hint">Drag to move · slider or scroll to zoom</div>
        <div style="display:flex;gap:10px"><button class="btn sec auto" id="cx">Cancel</button><button class="btn auto" id="ck">Use photo</button></div></div>`;
      document.body.append(ov);
      const c = ov.querySelector("canvas"), g = c.getContext("2d"), zs = ov.querySelector("#z");
      const base = Math.max(W / im.width, H / im.height);
      let z = 1, x = 0, y = 0, drag = null;
      const draw = () => {
        const s = base * z, mx = (im.width * s - W) / 2, my = (im.height * s - H) / 2;
        x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y));
        g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
        g.drawImage(im, W / 2 + x - im.width * s / 2, H / 2 + y - im.height * s / 2, im.width * s, im.height * s);
      };
      const done = v => { URL.revokeObjectURL(url); ov.remove(); res(v); };
      zs.oninput = () => { z = +zs.value; draw(); };
      c.onwheel = e => { e.preventDefault(); z = Math.min(6, Math.max(1, z - e.deltaY * .003)); zs.value = z; draw(); };
      c.onpointerdown = e => { drag = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); };
      c.onpointermove = e => {
        if (!drag) return;
        const k = W / c.getBoundingClientRect().width;
        x += (e.clientX - drag[0]) * k; y += (e.clientY - drag[1]) * k; drag = [e.clientX, e.clientY]; draw();
      };
      c.onpointerup = () => drag = null;
      ov.querySelector("#cx").onclick = () => done(null);
      ov.querySelector("#ck").onclick = () => done(c.toDataURL("image/jpeg", .72).split(",")[1]);
      draw();
    };
    im.src = url;
  });
}

// ===== TEAMS / LOGIN =====
const fallback = () => DEFAULT_TEAMS.map(id => ({id, name:id, tid:"default", locked:false, pw:TEAM_HASH}));
async function loadTeams(){
  try {
    const [snap, cfg, ts] = await Promise.all([getDocs(collection(db, COL)), getDoc(doc(db, "config", "admin")), getDocs(collection(db, "tournaments"))]);
    S.tours = [{id:"default", name:"Challenger's Cup"}, ...ts.docs.map(d => ({id:d.id, name:d.data().name || d.id, at:d.data().created || 0})).sort((a, b) => a.at - b.at)];
    S.teams = snap.docs.map(d => ({id:d.id, name:d.data().team_name || d.id, tid:d.data().tournament || "default", locked:!!d.data().is_locked, pw:d.data().pw_hash || TEAM_HASH})).sort((a, b) => a.name.localeCompare(b.name));
    S.adminHash = cfg.exists() ? cfg.data().hash : ADMIN_HASH;
    S.seeded = S.teams.length > 0;
    if (!S.seeded) S.teams = fallback();
    S.err = "";
  } catch (e) { S.tours = [{id:"default", name:"Challenger's Cup"}]; S.teams = fallback(); S.adminHash = ADMIN_HASH; S.err = e.message; }
}
const goHome = async () => { S.page = "home"; S.msg = ""; await loadTeams(); home(); };

function home(){
  $("#app").innerHTML = `
  <div class="login">
    <div class="lt">⚡ Enter Your Squad</div>
    <label class="l">Select Tournament</label>
    <select id="tour">${S.tours.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select>
    <label class="l">Select Your Team</label>
    <select id="team"></select>
    <label class="l">Password</label>
    <input type="password" id="pw" placeholder="Enter team password…">
    <button class="btn" id="enter">Enter Dashboard</button>
    <button class="btn sec" id="view">👁️ View Squad</button>
    <div class="admin">🔒 League Admin</div>
    <input type="password" id="ap" placeholder="Admin only…">
    <div id="adm"></div>
    <div class="msg err" id="m">${esc(S.err)}</div>
  </div>`;
  const m = t => { $("#m").textContent = t; };
  const fill = () => { $("#team").innerHTML = S.teams.filter(t => t.tid === $("#tour").value).map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("") || `<option value="">No teams yet</option>`; };
  $("#tour").onchange = fill; fill();
  $("#enter").onclick = async () => {
    const t = S.teams.find(x => x.id === $("#team").value);
    if (t && await sha($("#pw").value) === t.pw) openSquad(t.id, false); else m("Incorrect password.");
  };
  $("#view").onclick = () => { if ($("#team").value) openSquad($("#team").value, true); };
  $("#ap").oninput = async () => {
    const ok = await sha($("#ap").value) === S.adminHash;
    $("#adm").innerHTML = ok ? `<button class="btn" id="oa">⚙️ Open Admin Panel</button>` : "";
    if (ok) $("#oa").onclick = openAdmin;
  };
}

// ===== ADMIN PANEL =====
async function openAdmin(){
  $("#app").innerHTML = `<div class="msg">Loading…</div>`;
  if (!S.seeded) {
    try {
      const b = writeBatch(db);
      DEFAULT_TEAMS.forEach(t => b.set(doc(db, COL, t), {team_name:t, pw_hash:TEAM_HASH, is_locked:false}, {merge:true}));
      await b.commit(); S.seeded = true;
    } catch (e) { S.err = e.message; }
  }
  await loadTeams(); admin(S.err, "err");
}
function admin(msg = "", cls = "ok"){
  $("#app").innerHTML = `
  <div class="th"><div><div class="tn gold">Admin Panel</div><div class="ts">Teams · Passwords · Locks</div></div></div>
  <div class="panel"><div class="ph">🏆 Create Tournament</div>
    <div class="row" style="border:none"><input type="text" id="tn" placeholder="Tournament name"><button class="btn sm auto" id="ct">Create</button></div></div>
  <div class="panel"><div class="ph">➕ Add Team / Login</div>
    <div class="row"><select id="nto" style="width:200px">${S.tours.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select><input type="text" id="nt" placeholder="Team name"><input type="password" id="np" placeholder="Team password"><button class="btn sm auto" id="add">Add Team</button></div></div>
  <div class="panel"><div class="ph">Teams (${S.teams.length})</div>
    ${S.teams.map((t, i) => `<div class="row"><b>${t.locked ? "🔒" : "🔓"} ${esc(t.name)} <small style="opacity:.6">· ${esc((S.tours.find(x => x.id === t.tid) || {}).name || t.tid)}</small></b>
      <input type="password" data-pw="${i}" placeholder="New password">
      <button class="btn sm auto" data-act="pw" data-i="${i}">Set Password</button>
      <button class="btn sm sec auto" data-act="lock" data-i="${i}">${t.locked ? "Unlock" : "Lock"}</button>
      <button class="btn sm sec auto" data-act="view" data-i="${i}">View</button>
      <button class="btn sm sec auto" data-act="del" data-i="${i}" style="color:#ff7b7b;border-color:#ff7b7b66">Delete</button></div>`).join("")}
    <div class="row" style="border:none"><button class="btn sm auto" id="lall">🔒 Lock All</button><button class="btn sm auto" id="uall">🔓 Unlock All</button></div></div>
  <div class="panel"><div class="ph">Change Admin Password</div>
    <div class="row" style="border:none"><input type="password" id="nap" placeholder="New admin password"><button class="btn sm auto" id="cap">Change</button></div></div>
  <div class="bar"><button class="btn sec auto" id="hm">🏠 Home</button><div class="msg ${cls}" id="am" style="margin:0">${esc(msg)}</div></div>`;
  const flash = (t, c) => { $("#am").className = "msg " + c; $("#am").textContent = t; };
  const run = async (fn, ok) => { try { await fn(); await loadTeams(); admin(ok, "ok"); } catch (e) { flash(e.message || "Error", "err"); } };
  const setAll = v => run(async () => { const b = writeBatch(db); S.teams.forEach(t => b.set(doc(db, COL, t.id), {is_locked:v}, {merge:true})); await b.commit(); }, v ? "All squads LOCKED." : "All squads UNLOCKED.");
  $("#hm").onclick = goHome;
  $("#ct").onclick = () => {
    const n = $("#tn").value.trim(), id = n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "t" + Date.now();
    if (!n || id === "default") return flash("Enter a valid tournament name.", "err");
    if (S.tours.some(t => t.id === id)) return flash("That tournament already exists.", "err");
    run(() => setDoc(doc(db, "tournaments", id), {name:n, created:Date.now()}), `Tournament "${n}" created.`);
  };
  $("#lall").onclick = () => setAll(true);
  $("#uall").onclick = () => setAll(false);
  $("#add").onclick = () => {
    const n = $("#nt").value.trim(), p = $("#np").value;
    if (!n || n.includes("/") || n === "." || n === "..") return flash("Enter a valid team name (no slashes).", "err");
    if (p.length < 4) return flash("Password must be at least 4 characters.", "err");
    const tid = $("#nto").value, did = tid === "default" ? n : tid + "__" + n;
    if (S.teams.some(t => t.id.toLowerCase() === did.toLowerCase())) return flash("That team already exists in this tournament.", "err");
    run(async () => setDoc(doc(db, COL, did), {team_name:n, tournament:tid, pw_hash:await sha(p), is_locked:false, player_list:Array(17).fill(""), squad_pics:{}, captain_name:"", cap_pic:null, team_logo:null}), `Team "${n}" added.`);
  };
  $("#cap").onclick = () => {
    const p = $("#nap").value;
    if (p.length < 6) return flash("Admin password must be at least 6 characters.", "err");
    run(async () => setDoc(doc(db, "config", "admin"), {hash:await sha(p)}), "Admin password changed.");
  };
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const t = S.teams[+b.dataset.i], a = b.dataset.act;
    if (a === "pw") {
      const p = document.querySelector(`[data-pw="${b.dataset.i}"]`).value;
      if (p.length < 4) return flash("Password must be at least 4 characters.", "err");
      run(async () => setDoc(doc(db, COL, t.id), {pw_hash:await sha(p)}, {merge:true}), `Password updated for ${t.name}.`);
    } else if (a === "lock") run(() => setDoc(doc(db, COL, t.id), {is_locked:!t.locked}, {merge:true}), `${t.name} ${t.locked ? "unlocked" : "locked"}.`);
    else if (a === "view") openSquad(t.id, true);
    else if (confirm(`Delete "${t.name}" and its whole squad?`)) run(() => deleteDoc(doc(db, COL, t.id)), `${t.name} deleted.`);
  });
}

async function openSquad(team, viewOnly){
  $("#app").innerHTML = `<div class="msg">Loading…</div>`;
  try {
    const snap = await getDoc(doc(db, COL, team));
    const x = snap.exists() ? snap.data() : {};
    S.d = {
      is_locked: !!x.is_locked,
      names: Array.from({length:17}, (_, i) => (x.player_list || [])[i] || ""),
      pics: x.squad_pics || {},
      cap_name: x.captain_name || "",
      cap_pic: x.cap_pic || null,
      logo: x.team_logo || null
    };
  } catch (e) {
    $("#app").innerHTML = `<div class="login"><div class="msg err">Connection error: ${esc(e.message)}</div><button class="btn sec" id="b">Back</button></div>`;
    $("#b").onclick = home; return;
  }
  const tm = S.teams.find(x => x.id === team);
  Object.assign(S, {page:"squad", team, tname:tm ? tm.name : team, tour:(S.tours.find(x => tm && x.id === tm.tid) || S.tours[0]).name, viewOnly, edit:false, msg:""});
  squad();
}

// ===== SQUAD =====
function squad(){
  const d = S.d, edit = S.edit && !S.viewOnly && !d.is_locked;
  const up = (id) => edit ? `<label class="up">⬆<input type="file" accept="image/*" data-up="${id}"></label>` : "";
  let cards = "";
  for (let i = 0; i < 17; i++){
    const p = d.pics[i];
    cards += `<div><div class="card"><div class="glow"></div><div class="inner">
      <div class="num">${i+1}</div>
      <div class="img">${p ? `<img src="data:image/jpeg;base64,${p}">` : `<svg viewBox="0 0 24 24" fill="none" style="width:50%;opacity:.25"><circle cx="12" cy="8" r="4" stroke="#4060a0" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#4060a0" stroke-width="1.5" stroke-linecap="round"/></svg>`}</div>
      ${d.names[i] ? `<div class="nb">${esc(d.names[i])}</div>` : `<div class="nb e">Player</div>`}
    </div></div>
    ${edit ? `<div class="ed"><input type="text" data-n="${i}" value="${esc(d.names[i])}" placeholder="Player ${i+1}">${up(i)}</div>` : ""}</div>`;
  }
  $("#app").innerHTML = `
  <div class="th">
    <div class="logo ${d.logo ? "has" : ""}">${d.logo ? `<img src="data:image/jpeg;base64,${d.logo}">` : ""}</div>
    <div><div class="tn gold">${esc(S.tname)}</div><div class="ts">${esc(S.tour)} · Season 18 2026</div></div>
  </div>
  ${d.is_locked && !S.viewOnly ? `<div class="lock">🔒 Squad is Locked</div>` : ""}
  ${edit ? `<div style="margin-bottom:14px"><label class="l">Team Logo</label><label class="up" style="display:inline-block;padding:4px 14px">⬆ Upload logo<input type="file" accept="image/*" data-up="logo"></label></div>` : ""}
  <div class="main">
    <div class="grid">${cards}</div>
    <div><div class="card cap"><div class="glow"></div><div class="inner">
      <div class="cl">★ CAPTAIN ★</div>
      <div class="num" style="top:36px;font-size:13px">18</div>
      <div class="img">${d.cap_pic ? `<img src="data:image/jpeg;base64,${d.cap_pic}">` : `<svg viewBox="0 0 24 24" fill="none" style="width:45%;opacity:.25"><circle cx="12" cy="8" r="4" stroke="#c8a84b" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#c8a84b" stroke-width="1.5" stroke-linecap="round"/></svg>`}</div>
      <div class="nb">${esc(d.cap_name || "Captain")}</div>
    </div></div>
    ${edit ? `<div class="ed"><input type="text" id="cn" value="${esc(d.cap_name)}" placeholder="Captain Name">${up("cap")}</div>` : ""}</div>
  </div>
  <div class="bar">
    <button class="btn sec auto" id="home">🏠 Home</button>
    ${S.viewOnly ? `<div class="badge">👁 View Only</div>` : `<label class="tg"><input type="checkbox" id="tg" ${edit ? "checked" : ""} ${d.is_locked ? "disabled" : ""}> ✏️ EDIT MODE</label>`}
    <div class="sp"></div><div class="msg ${S.msg.startsWith("✅") ? "ok" : "err"}" style="margin:0">${S.msg}</div>
    ${edit ? `<button class="btn auto" id="save">💾 Save All Changes</button>` : ""}
  </div>`;

  $("#home").onclick = goHome;
  if ($("#tg")) $("#tg").onchange = e => { S.edit = e.target.checked; S.msg = ""; squad(); };
  document.querySelectorAll("[data-n]").forEach(el => el.oninput = () => d.names[+el.dataset.n] = el.value);
  if ($("#cn")) $("#cn").oninput = e => d.cap_name = e.target.value;
  document.querySelectorAll("[data-up]").forEach(el => el.onchange = async () => {
    if (!el.files[0]) return;
    try {
      const k = el.dataset.up;
      const b = await crop(el.files[0], k === "cap" ? 45 / 42 : 1, k === "logo");
      el.value = "";
      if (!b) return;
      if (k === "logo") d.logo = b; else if (k === "cap") d.cap_pic = b; else d.pics[k] = b;
      squad();
    } catch { S.msg = "Could not read image."; squad(); }
  });
  if ($("#save")) $("#save").onclick = async () => {
    $("#save").disabled = true; $("#save").textContent = "Saving…";
    try {
      await setDoc(doc(db, COL, S.team), {
        team_name: S.tname, captain_name: d.cap_name, player_list: d.names,
        squad_pics: d.pics, cap_pic: d.cap_pic, team_logo: d.logo
      }, {merge: true});
      S.msg = "✅ Squad saved successfully!";
    } catch (e) { S.msg = "Save failed: " + e.message; }
    squad();
  };
}

await loadTeams();
home();
</script>
